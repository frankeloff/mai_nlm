name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gallery-deploy   # не «pages»: зависшие dynamic-запуски не должны блокировать наш деплой
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Сайт галереи: index.html в корне + холсты по относительным путям lab1/output/paintings/
      - name: Assemble site
        run: |
          mkdir -p _site/lab1/output
          cp index.html _site/
          cp -r lab1/output/paintings _site/lab1/output/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
